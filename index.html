<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exclusive Offer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="landing">

    <div class="overlay"></div>

    <section class="card">

      <div class="badge">EXCLUSIVE OFFER</div>

      <h1>Are You Interested<br>In This Product?</h1>

      <p>
        Discover this product on Amazon and check the
        latest available offer.
      </p>

      <div class="buttons">

        <button class="yes-btn" onclick="goToAmazon()">
          Yes, Continue to Amazon
          <span>→</span>
        </button>

        <button class="no-btn" onclick="closeOffer()">
          Not Now
        </button>

      </div>

      <div class="secure">
        🔒 Secure &nbsp; • &nbsp; Amazon
      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
